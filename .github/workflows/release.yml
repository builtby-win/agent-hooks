name: release

# Split build. macOS (arm64, x64, universal) and Linux (static musl, x64 + arm64)
# are built locally by scripts/release-local.sh and uploaded to the release.
# CI builds Windows only, plus attaches install.sh / install.ps1.
#
# Asset names are the contract install.sh, install.ps1 and the package wrappers rely on:
#   agent-hooks-<target>.tar.gz | .zip   (+ .sha256), containing agent-hooks-<target>/agent-hooks[.exe]
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must already exist, e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  BIN: agent-hooks
  PACKAGE: agent-hooks-cli

jobs:
  windows:
    name: ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p ${{ env.PACKAGE }} --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $Stage = "agent-hooks-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "$Stage/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "$Stage/"
          Compress-Archive -Path $Stage -DestinationPath "$Stage.zip"
          (Get-FileHash "$Stage.zip" -Algorithm SHA256).Hash.ToLower() + "  $Stage.zip" | Out-File "$Stage.zip.sha256" -Encoding ascii

      # arm64 can't execute on the x64 runner; it is build-only.
      - name: Smoke test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/$BIN.exe"
          "$exe" --version
          "$exe" list-adapters --json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: agent-hooks-${{ matrix.target }}
          path: |
            agent-hooks-${{ matrix.target }}.zip
            agent-hooks-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Tag push → github.ref_name is the tag; manual dispatch → inputs.tag.
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi

      # Appends to the release if scripts/release-local.sh already created it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            agent-hooks-*.zip
            agent-hooks-*.zip.sha256
            install.sh
            install.ps1
          generate_release_notes: true
